<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

  <!-- BaguetteBox CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/baguettebox.js/1.8.1/baguetteBox.min.css">

  <style>
    body {
      background: transparent; /* Notion-friendly */
      color: #fff;
    }

    .tz-gallery {
      padding: 5px;
      border-radius: 10px;
    }

    .tz-gallery .thumbnail {
      padding: 0;
      margin-bottom: 5px;
      background-color: transparent; /* transparent for Notion */
      border-radius: 10px;
      border: none;
      transition: 0.15s ease-in-out;
      box-shadow: none; /* remove white shadow */
      overflow: hidden;
    }

    .tz-gallery .thumbnail:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); /* soft glow hover */
    }

    .tz-gallery img {
      width: 100%;
      height: 250px; /* consistent height */
      object-fit: cover;
      border-radius: 20px;
      display: block;
    }

    .baguetteBox-button {
      background-color: transparent !important;
    }

    .baguetteBox-overlay {
      background-color: rgba(0, 0, 0, 0.95) !important; /* dark overlay */
    }
  </style>
</head>

<body>
  <main>
    <section id="gallery">
      <div class="gallery-container">
        <div class="tz-gallery">
          <div class="row">

            <div data-aos="flip-up" class="col-sm-6 col-md-4">
              <div class="thumbnail">
                <a class="lightbox" href="ch1.jpg">
                  <img src="ch1.jpg" alt="ch1">
                </a>
              </div>
            </div>

            <div data-aos="flip-up" data-aos-delay="20" class="col-sm-6 col-md-4">
              <div class="thumbnail">
                <a class="lightbox" href="ch2.jpg">
                  <img src="ch2.jpg" alt="ch2">
                </a>
              </div>
            </div>

            <div data-aos="flip-up" data-aos-delay="40" class="col-sm-6 col-md-4">
              <div class="thumbnail">
                <a class="lightbox" href="ch3.jpg">
                  <img src="ch3.jpg" alt="ch3">
                </a>
              </div>
            </div>

            <div data-aos="flip-up" data-aos-delay="80" class="col-sm-6 col-md-4">
              <div class="thumbnail">
                <a class="lightbox" href="ch5.jpg">
                  <img src="ch5.jpg" alt="ch5">
                </a>
              </div>
            </div>

            <div data-aos="flip-up" data-aos-delay="100" class="col-sm-6 col-md-4">
              <div class="thumbnail">
                <a class="lightbox" href="ch6.jpg">
                  <img src="ch6.jpg" alt="ch6">
                </a>
              </div>
            </div>

            <div data-aos="flip-up" data-aos-delay="160" class="col-sm-6 col-md-4">
              <div class="thumbnail">
                <a class="lightbox" href="ch9.jpg">
                  <img src="ch9.jpg" alt="ch9">
                </a>
              </div>
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- JS Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/baguettebox.js/1.8.1/baguetteBox.min.js"></script>
  <script>
    baguetteBox.run('.tz-gallery');
  </script>

  <!-- AOS (for animations) -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>

</body>

</html>
